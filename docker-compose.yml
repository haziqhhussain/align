version: '3.8'

services:
  align-postgres:
    image: postgres:15-alpine
    container_name: align-postgres
    restart: always
    environment:
      POSTGRES_USER: align_user
      POSTGRES_PASSWORD: align_password
      POSTGRES_DB: align_db
    ports:
      - "5432:5432"
    volumes:
      - align_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U align_user -d align_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  align-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: align-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://align_user:align_password@align-postgres:5432/align_db
      SECRET_KEY: align_super_secret_jwt_key_change_in_production_2026
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://127.0.0.1:5173","http://localhost:8000"]'
    ports:
      - "8000:8000"
    depends_on:
      align-postgres:
        condition: service_healthy

  align-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: align-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - align-backend

volumes:
  align_postgres_data:
